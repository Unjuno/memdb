name: Verify dependency repair
on:
  push:
    branches: ['feat/mvp']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record current audit (diagnostic, not a passing security gate)
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/audit-before.json || true
      - name: Resolve non-breaking advisory fixes into a candidate lock
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Test the candidate dependency graph
        run: |
          npm ci
          npm test
          npx --no-install wrangler deploy --dry-run
      - name: Verify candidate has no reported advisories
        run: npm audit --json > artifacts/audit-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-dependency-repair
          path: |
            package-lock.json
            artifacts/audit-*.json
          if-no-files-found: error
          retention-days: 3
